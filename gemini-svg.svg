<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Texto Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Acento Gradient Ascendente -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Sombra del Texto -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado 512x512 con bordes redondeados suavemente -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)" />

  <!-- Elemento Gráfico Ascendente (Metáfora de Progresión) -->
  <g transform="translate(0, -10)">
    <path d="M 96 340 L 140 340 L 170 310 L 126 310 Z" fill="url(#accentGrad)" opacity="0.4" />
    <path d="M 150 340 L 210 340 L 250 300 L 190 300 Z" fill="url(#accentGrad)" opacity="0.7" />
    <path d="M 220 340 L 416 340 L 416 332 L 230 332 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Texto Principal: Anupubba -->
  <text 
    x="256" 
    y="270" 
    font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
    font-size="62" 
    font-weight="800" 
    letter-spacing="1.5"
    fill="url(#textGrad)" 
    text-anchor="middle"
    filter="url(#glow)">
    Anupubba
  </text>

  <!-- Subtexto en Español: PASO A PASO -->
  <text 
    x="256" 
    y="305" 
    font-family="'Inter', 'Segoe UI', sans-serif" 
    font-size="14" 
    font-weight="600" 
    letter-spacing="9" 
    fill="#94a3b8" 
    text-anchor="middle" 
    opacity="0.9">
    PASO A PASO
  </text>

  <!-- Detalle sutil de enmarcado -->
  <rect x="24" y="24" width="464" height="464" rx="20" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />
</svg>
